name: Build pdf.json

on:
  push:
    paths:
      - '**/*.pdf'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate pdf.json
        run: |
          echo "[" > pdf.json
          first=true
          find . -type f -name "*.pdf" | while read -r filepath; do
            cleanpath="${filepath#./}"
            
            # استخراج اسم المجلد كـ تصنيف
            category=$(dirname "$cleanpath")
            if [ "$category" = "." ]; then
              category="كتب عامة"
            fi
            
            # استخراج اسم الملف كعنوان
            filename=$(basename "$cleanpath" .pdf)
            title="${filename//_/ }" # استبدال الشرطة السفلى بمسافات
            
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> pdf.json
            fi
            
            echo "  {" >> pdf.json
            echo "    \"title\": \"$title\"," >> pdf.json
            echo "    \"category\": \"$category\"," >> pdf.json
            echo "    \"size\": \"ملف PDF طبي\"," >> pdf.json
            echo "    \"url\": \"https://raw.githubusercontent.com/nano-Nawfal/medical-pdf-library/main/$cleanpath\"" >> pdf.json
            echo "  }" >> pdf.json
          done
          echo "]" >> pdf.json

      - name: Commit pdf.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update pdf.json automatically"
